name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which files changed — no third-party actions
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native_or_packaging: ${{ steps.classify.outputs.native_or_packaging }}
      browser_extension: ${{ steps.classify.outputs.browser_extension }}
      release_update: ${{ steps.classify.outputs.release_update }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: classify
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          fi
          printf '%s\n' "$FILES"
          printf '%s\n' "$FILES" | ./scripts/classify_changed_files.sh | tee -a "$GITHUB_OUTPUT"

  classifier-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./scripts/test_classify_changed_files.sh
      - run: python3 ./scripts/test_merge_appcast_item.py
      - run: ./scripts/test_localvqe_runtime_validation.sh
      - run: ./scripts/test_release_workflow_security.sh

  # Release build — validate the app product compiles in release mode
  build_release:
    needs: changes
    if: needs.changes.outputs.native_or_packaging == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build (release)
        run: swift build --package-path native/MuesliNative -c release --product MuesliNativeApp

  browser-extension:
    needs: changes
    if: needs.changes.outputs.native_or_packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Meet speaker extension
        run: |
          node --check browser-extension/muesli-meet-speaker/content.js
          node --test browser-extension/muesli-meet-speaker/content.test.js

  # Swift tests — sharded by domain to reduce end-to-end wall time
  test_shards:
    needs: changes
    if: needs.changes.outputs.native_or_packaging == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [core, dictation-transcription, meetings]
    name: test (${{ matrix.shard }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run test shard
        run: bash ./scripts/run_ci_test_shard.sh "${{ matrix.shard }}"

  # Packaged CLI smoke test — verify the app bundle contains muesli-cli
  cli-smoke:
    needs: changes
    if: needs.changes.outputs.native_or_packaging == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify packaged CLI bundle
        run: ./scripts/test_packaged_cli.sh

  # Sparkle appcast/update metadata smoke test — catches broken release URLs,
  # missing signatures, accidental delta entries, and malformed appcast XML.
  update-flow:
    needs: changes
    if: needs.changes.outputs.native_or_packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Sparkle update metadata
        run: |
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/ivkiwi/guesli/sparkle-feed/docs/appcast-guesli.xml \
            -o "$RUNNER_TEMP/appcast-guesli.xml"
          ./scripts/verify_update_flow.sh \
            --skip-dmg \
            --appcast "$RUNNER_TEMP/appcast-guesli.xml" \
            --app-name Guesli \
            --feed-url https://raw.githubusercontent.com/ivkiwi/guesli/sparkle-feed/docs/appcast-guesli.xml \
            --asset-url-prefix https://github.com/ivkiwi/guesli/releases/download/

  # Gate job — always runs, always reports a status
  # This is the only required check in branch protection
  ci-gate:
    if: always()
    needs: [changes, classifier-tests, build_release, browser-extension, test_shards, cli-smoke, update-flow]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.classifier-tests.result }}" == "success" ]] && \
             [[ "${{ needs.build_release.result }}" =~ ^(success|skipped)$ ]] && \
             [[ "${{ needs.browser-extension.result }}" =~ ^(success|skipped)$ ]] && \
             [[ "${{ needs.test_shards.result }}" =~ ^(success|skipped)$ ]] && \
             [[ "${{ needs.cli-smoke.result }}" =~ ^(success|skipped)$ ]] && \
             [[ "${{ needs.update-flow.result }}" =~ ^(success|skipped)$ ]]; then
            echo "CI passed (build_release: ${{ needs.build_release.result }}, browser-extension: ${{ needs.browser-extension.result }}, test_shards: ${{ needs.test_shards.result }}, cli-smoke: ${{ needs.cli-smoke.result }}, update-flow: ${{ needs.update-flow.result }})"
          else
            echo "CI failed (build_release: ${{ needs.build_release.result }}, browser-extension: ${{ needs.browser-extension.result }}, test_shards: ${{ needs.test_shards.result }}, cli-smoke: ${{ needs.cli-smoke.result }}, update-flow: ${{ needs.update-flow.result }})"
            exit 1
          fi
