name: Build macOS Beta App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the beta artifact (for example 0.3.0-beta.1)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "This workflow only publishes beta builds. Official tagged releases must use scripts/release.sh." >&2
            exit 1
          fi

          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="0.0.0-beta.${GITHUB_RUN_NUMBER}"
          fi
          BUNDLE_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          SAFE_VERSION="${VERSION//[^A-Za-z0-9._-]/-}"
          TAG_NAME="beta-${SAFE_VERSION}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Guesli Beta ${VERSION}"
          PRERELEASE="true"
          RELEASE_NOTES=$'Russian-focused Guesli build: Muesli fork with telemetry removed and Google Meet speaker bridge included.\n\nThis build uses the stable self-signed Guesli Dev identity with local-only entitlements, so macOS privacy grants survive Guesli updates. It is not Apple-notarized; first launch may require System Settings > Privacy & Security > Open Anyway.'
          ASSET_SUFFIX="-selfsigned-unnotarized"

          APP_DIR="dist/Guesli.app"
          APP_ZIP="dist/Guesli-${SAFE_VERSION}${ASSET_SUFFIX}.zip"
          DMG_PATH="dist/Guesli-${SAFE_VERSION}${ASSET_SUFFIX}.dmg"
          EXTENSION_ZIP="dist/Guesli-Meet-Speaker-Bridge-${SAFE_VERSION}.zip"

          {
            echo "version=$VERSION"
            echo "bundle_version=$BUNDLE_VERSION"
            echo "tag_name=$TAG_NAME"
            echo "release_title=$RELEASE_TITLE"
            echo "prerelease=$PRERELEASE"
            echo "app_dir=$APP_DIR"
            echo "app_zip=$APP_ZIP"
            echo "dmg_path=$DMG_PATH"
            echo "extension_zip=$EXTENSION_ZIP"
            echo "release_notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check browser extension
        run: |
          node --check browser-extension/muesli-meet-speaker/content.js
          node --test browser-extension/muesli-meet-speaker/content.test.js

      - name: Run Meet speaker tests
        run: |
          if [[ -f native/MuesliNative/Tests/MuesliTests/MeetSpeakerBridgeTests.swift ]]; then
            swift test --package-path native/MuesliNative --scratch-path "$RUNNER_TEMP/muesli-spm" --filter MeetSpeakerBridgeTests
          else
            echo "Meet speaker bridge tests are not present on this ref; skipping focused test step."
          fi

      - name: Install Guesli signing identity
        timeout-minutes: 2
        env:
          SIGNING_P12_BASE64: ${{ secrets.GUESLI_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.GUESLI_SIGNING_P12_PASSWORD }}
        run: |
          test -n "$SIGNING_P12_BASE64"
          test -n "$SIGNING_P12_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/Guesli-Dev.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/Guesli-Dev.pem"
          KEYCHAIN_PATH="$RUNNER_TEMP/guesli-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$SIGNING_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security find-certificate -c "Guesli Dev" -p "$KEYCHAIN_PATH" > "$CERTIFICATE_PEM"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$CERTIFICATE_PEM"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH" "$CERTIFICATE_PEM"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F '358AF852086E36AA4924D01D84B47F462776D496 "Guesli Dev"'

      - name: Build app bundle
        env:
          MUESLI_INSTALL_DIR: ${{ github.workspace }}/dist
          MUESLI_BUILD_VERSION: ${{ steps.meta.outputs.version }}
          MUESLI_BUNDLE_VERSION: ${{ steps.meta.outputs.bundle_version }}
          MUESLI_SHORT_VERSION: ${{ steps.meta.outputs.version }}
          MUESLI_APP_NAME: Guesli
          MUESLI_DISPLAY_NAME: Guesli
          MUESLI_APP_BUNDLE_NAME: Guesli.app
          MUESLI_EXECUTABLE_NAME: Guesli
          MUESLI_SUPPORT_DIR_NAME: Guesli
          MUESLI_BUNDLE_ID: com.ivkiwi.guesli
          MUESLI_SPARKLE_FEED_URL: https://raw.githubusercontent.com/ivkiwi/guesli/sparkle-feed/docs/appcast-guesli.xml
          MUESLI_SPARKLE_EDKEY: x1xV1WAX32xkX4Yl4dxV9HctwCP/dm/K/9YUzWxk7Kc=
          MUESLI_ENTITLEMENTS: ${{ github.workspace }}/scripts/MuesliLocalOnly.entitlements
          MUESLI_SKIP_SIGN: "1"
          MUESLI_SIGN_IDENTITY: Guesli Dev
          MUESLI_SWIFTPM_SCRATCH_PATH: ${{ runner.temp }}/muesli-spm
        run: ./scripts/build_native_app.sh release

      - name: Verify packaged app
        shell: bash
        run: |
          APP_DIR="${{ steps.meta.outputs.app_dir }}"
          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_DIR/Contents/Info.plist")"
          APP_BIN="$APP_DIR/Contents/MacOS/$APP_EXECUTABLE"
          ENTITLEMENTS_PLIST="$RUNNER_TEMP/guesli-entitlements.plist"

          test -d "$APP_DIR"
          test -x "$APP_BIN"
          test -x "$APP_DIR/Contents/MacOS/muesli-cli"

          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          codesign -dvv "$APP_DIR" 2>&1 | grep -F 'Authority=Guesli Dev'
          codesign -d -r- "$APP_DIR" 2>&1 | grep -F 'certificate leaf = H"358af852086e36aa4924d01d84b47f462776d496"'
          codesign -d --entitlements :- "$APP_DIR" > "$ENTITLEMENTS_PLIST"

          if /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-services' "$ENTITLEMENTS_PLIST" >/dev/null 2>&1; then
            echo "ERROR: self-signed Guesli release must not include CloudKit entitlements." >&2
            cat "$ENTITLEMENTS_PLIST" >&2
            exit 1
          fi

          if /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers' "$ENTITLEMENTS_PLIST" >/dev/null 2>&1; then
            echo "ERROR: self-signed Guesli release must not include iCloud container entitlements." >&2
            cat "$ENTITLEMENTS_PLIST" >&2
            exit 1
          fi

          "$APP_DIR/Contents/MacOS/muesli-cli" spec >/dev/null

      - name: Package app zip
        run: |
          APP_ZIP="${{ steps.meta.outputs.app_zip }}"
          mkdir -p "$(dirname "$APP_ZIP")"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "${{ steps.meta.outputs.app_dir }}" "$APP_ZIP"

      - name: Create DMG
        run: |
          STAGING="$(mktemp -d)"
          cp -R "${{ steps.meta.outputs.app_dir }}" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Guesli" -srcfolder "$STAGING" -ov -format UDZO "${{ steps.meta.outputs.dmg_path }}"
          rm -rf "$STAGING"

      - name: Package Meet speaker extension
        run: |
          EXTENSION_ZIP="${{ steps.meta.outputs.extension_zip }}"
          if [[ -d browser-extension/muesli-meet-speaker ]]; then
            mkdir -p "$(dirname "$EXTENSION_ZIP")"
            /usr/bin/ditto -c -k --keepParent browser-extension/muesli-meet-speaker "$EXTENSION_ZIP"
          else
            echo "Meet speaker extension is not present on this ref; skipping extension package."
          fi

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Guesli-macos
          path: |
            ${{ steps.meta.outputs.dmg_path }}
            ${{ steps.meta.outputs.app_zip }}
          compression-level: 0

      - name: Upload Meet speaker extension artifact
        if: hashFiles('browser-extension/muesli-meet-speaker/content.js') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Guesli-Meet-Speaker-Bridge
          path: |
            ${{ steps.meta.outputs.extension_zip }}
          compression-level: 0

      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.meta.outputs.tag_name }}"
          RELEASE_TITLE="${{ steps.meta.outputs.release_title }}"
          DMG="${{ steps.meta.outputs.dmg_path }}"
          APP_ZIP="${{ steps.meta.outputs.app_zip }}"
          EXTENSION_ZIP="${{ steps.meta.outputs.extension_zip }}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'EOF'
          ${{ steps.meta.outputs.release_notes }}
          EOF

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            GH_ARGS=(
              "$TAG_NAME"
              --title "$RELEASE_TITLE"
              --notes-file "$NOTES_FILE"
              --target "$GITHUB_SHA"
            )
            if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
              GH_ARGS+=(--prerelease)
            fi
            gh release create "${GH_ARGS[@]}"
          fi
          ASSETS=("$DMG" "$APP_ZIP")
          if [[ -f "$EXTENSION_ZIP" ]]; then
            ASSETS+=("$EXTENSION_ZIP")
          fi
          gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber

      - name: Publish Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          DMG_PATH: ${{ steps.meta.outputs.dmg_path }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          UPDATES_DIR="$RUNNER_TEMP/guesli-sparkle"
          mkdir -p "$UPDATES_DIR"
          cp "$DMG_PATH" "$UPDATES_DIR/"
          GENERATE_APPCAST="$RUNNER_TEMP/muesli-spm/artifacts/sparkle/Sparkle/bin/generate_appcast"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/ivkiwi/guesli/releases/download/${TAG_NAME}/" \
            --link "https://github.com/ivkiwi/guesli/releases" \
            -o "$UPDATES_DIR/appcast-guesli.xml" \
            "$UPDATES_DIR"
          APPCAST="$RUNNER_TEMP/appcast-guesli.xml"
          cp "$UPDATES_DIR/appcast-guesli.xml" "$APPCAST"
          git fetch origin sparkle-feed || true
          if git rev-parse --verify origin/sparkle-feed >/dev/null 2>&1; then
            git checkout -B sparkle-feed origin/sparkle-feed
          else
            git checkout -B sparkle-feed
          fi
          mkdir -p docs
          cp "$APPCAST" docs/appcast-guesli.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast-guesli.xml
          git diff --cached --quiet || git commit -m "Update Guesli Sparkle appcast"
          git push origin "HEAD:sparkle-feed"
